<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enviiro - Sign In</title>
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <nav class="navbar">
    <div class="logo-text"><span class="en">En</span><span class="vii">vii</span><span class="ro">ro</span></div>
    <ul class="nav-links">
      <li class="brand">Enviiro</li>
      <li><a href="signup.html">Sign Up</a></li> 
    </ul>
  </nav>

  <main>
    <section class="login-section">
      <h1 class="login-title">Sign In to <span class="logo-text"><span class="en">En</span><span class="vii">vii</span><span class="ro">ro</span></span></h1>
      <div id="login-error" class="error-message"></div>
      <form action="login.jsp" method="post" class="login-form">
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Sign In</button>
        <p class="signup-link">Don't have an account? <a href="signup.html">Sign up here</a>.</p>
      </form>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const urlParams = new URLSearchParams(window.location.search);
      const error = urlParams.get('error');
      const messageDiv = document.getElementById('login-error');

      if (error) {
        let message = 'An unknown error occurred.';
        if (error === 'invalid_credentials') {
          message = 'Invalid email or password.';
        } else if (error === 'missing_fields') {
            message = 'Email and password are required.';
        } else if (error === 'db_error') {
            message = 'Database error during login. Please try again later.';
        } else if (error === 'unexpected') {
             message = 'An unexpected error occurred. Please try again later.';
        }
        messageDiv.textContent = message;
      }
    });
  </script>
</body>
</html>
